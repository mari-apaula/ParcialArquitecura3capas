{% extends "base.html" %}
{% block content %}
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">
                {% if producto %} <i class="fas fa-edit"></i> Editar Lote {% else %} <i class="fas fa-plus-circle"></i> Nuevo Registro {% endif %}
            </h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-12 mb-3"><h5 class="text-primary border-bottom pb-2">Datos de Origen</h5></div>
                    <div class="col-md-4 mb-3">
                        <label>Código Lote</label>
                        <input type="text" name="lote" value="{{ producto.lote if producto else '' }}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Variedad (Ej. Tommy)</label>
                        <input type="text" name="variedad" value="{{ producto.variedad if producto else '' }}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Finca / Ubicación</label>
                        <input type="text" name="finca" value="{{ producto.finca if producto else '' }}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Fecha Cosecha</label>
                        <input type="date" name="fecha_cosecha" value="{{ producto.fecha_cosecha if producto else '' }}" class="form-control" required>
                    </div>

                    <div class="col-md-12 mb-3 mt-3"><h5 class="text-primary border-bottom pb-2">Proceso & Calidad</h5></div>
                    <div class="col-md-6 mb-3">
                        <label>Fecha Empaquetado</label>
                        <input type="date" name="fecha_empaquetado" value="{{ producto.fecha_empaquetado if producto else '' }}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Control de Calidad</label>
                        <select name="calidad_ok" class="form-control">
                            <option value="Aprobado" {% if producto and producto.calidad_ok == 'Aprobado' %}selected{% endif %}>Aprobado</option>
                            <option value="Rechazado" {% if producto and producto.calidad_ok == 'Rechazado' %}selected{% endif %}>Rechazado</option>
                        </select>
                    </div>

                    <div class="col-md-12 mb-3 mt-3"><h5 class="text-primary border-bottom pb-2">Logística</h5></div>
                    <div class="col-md-6 mb-3">
                        <label>Temperatura Transporte (°C)</label>
                        <input type="number" step="0.1" name="temperatura_transporte" value="{{ producto.temperatura_transporte if producto else '' }}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Fecha Entrega</label>
                        <input type="date" name="fecha_entrega" value="{{ producto.fecha_entrega if producto else '' }}" class="form-control" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <a href="/" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
